[project]
name = "smart-pole"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.2",
    "gdown>=6.0.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "pandas>=3.0.3",
    "polars>=1.40.1",
    "pyarrow>=24.0.0",
    "requests>=2.34.0",
    "seaborn>=0.13.2",
    "pyyaml>=6.0",
    "pytest>=8.0",
    "scikit-learn>=1.8.0",
    "gstools>=1.7.0",
    "gpytorch>=1.15.2",
    "statsmodels>=0.14.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_pole"]
