seed: 4
data:
  cache_path: data/pole_hourly.parquet
  station_info_path: data/MOENV_iot_station.csv
  target_var: pm25
  start: 2025-12-04
  end: 2026-02-05
  freq: 1h
masking:
  strategy: random_point
  ratio: 0.2
  block_hours: 6
neighbors:
  selector: correlation
  k_list:
  - 30
  - 20
  - 10
  - 5
  - 3
  - 1
  params: {}
  k_actual: 3
split:
  method: time_based
  train_ratio: 0.8
features:
  enabled: true
  lags:
  - 1
  - 2
  - 3
  - 6
  - 24
  rolling:
  - 3
  - 6
  - 24
model:
  name: gls
  params:
    cov_structure: ar1
    max_iter: 3
    min_train: 100
evaluation:
  metrics:
  - mae
  - rmse
  - r2
  plots:
  - scatter
  - residual_ts
  - k_curve
  - spatial_error
  explain: true
experiment_id: exp_gls
seeds:
- 1
- 2
- 3
- 4
- 5
