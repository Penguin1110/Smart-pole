seed: 42
data:
  cache_path: data/pole_hourly.parquet
  station_info_path: data/MOENV_iot_station.csv
  target_var: pm25
  start: 2025-12-04
  end: 2026-02-05
  freq: 1h
masking:
  strategy: random_point
  ratio: 0.2
  block_hours: 6
neighbors:
  selector: correlation
  k_list:
  - 10
  params: {}
split:
  method: time_based
  train_ratio: 0.8
features:
  enabled: false
  lags:
  - 1
  - 2
  - 3
  - 6
  - 24
  rolling:
  - 3
  - 6
  - 24
model:
  name: dineof
  params:
    n_modes: 5
    max_iter: 30
    tol: 0.0001
evaluation:
  metrics:
  - mae
  - rmse
  - r2
  plots:
  - scatter
  - residual_ts
  - spatial_error
  explain: true
experiment_id: exp_dineof
seeds:
- 1
- 2
- 3
- 4
- 5
