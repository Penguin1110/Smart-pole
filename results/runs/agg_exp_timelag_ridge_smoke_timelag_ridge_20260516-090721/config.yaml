seed: 42
data:
  cache_path: data/pole_hourly.parquet
  station_info_path: data/MOENV_iot_station.csv
  target_var: pm25
  start: 2025-12-04
  end: 2026-02-05
  freq: 1h
masking:
  strategy: random_point
  ratio: 0.2
  block_hours: 6
neighbors:
  selector: correlation
  k_list:
  - 10
  params: {}
split:
  method: time_based
  train_ratio: 0.8
features:
  enabled: true
  lags:
  - 1
  - 2
  - 3
  - 6
  - 24
  rolling:
  - 3
  - 6
  - 24
model:
  name: timelag_ridge
  params:
    alpha: 1.0
    min_train: 100
evaluation:
  metrics:
  - mae
  - rmse
  - r2
  plots:
  - k_curve
  explain: true
experiment_id: exp_timelag_ridge_smoke
seeds:
- 1
