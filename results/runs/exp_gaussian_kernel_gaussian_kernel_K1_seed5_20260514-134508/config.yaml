seed: 5
data:
  cache_path: data/pole_hourly.parquet
  station_info_path: data/MOENV_iot_station.csv
  target_var: pm25
  start: 2025-12-04
  end: 2026-02-05
  freq: 1h
masking:
  strategy: random_point
  ratio: 0.2
  block_hours: 6
neighbors:
  selector: distance
  k_list:
  - 30
  - 20
  - 10
  - 5
  - 3
  - 1
  k_actual: 1
split:
  method: time_based
  train_ratio: 0.8
model:
  name: gaussian_kernel
  params:
    sigma: 2000.0
evaluation:
  metrics:
  - mae
  - rmse
  - r2
  plots:
  - scatter
  - residual_ts
  - k_curve
  - spatial_error
experiment_id: exp_gaussian_kernel
seeds:
- 1
- 2
- 3
- 4
- 5
