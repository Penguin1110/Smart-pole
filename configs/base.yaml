# 所有實驗的預設值;experiments/*.yaml 覆蓋對應欄位即可。
seed: 42

data:
  cache_path: data/pole_hourly.parquet
  station_info_path: data/MOENV_iot_station.csv   # 環境部 IoT 測站清單,提供 lat/lon
  target_var: pm25
  start: null
  end:   null
  freq:  1h

masking:
  strategy: random_point   # random_point | block | whole_station
  ratio: 0.20
  block_hours: 6

neighbors:
  selector: distance       # distance | correlation
  k_list: [30, 20, 10, 5, 3, 1]

split:
  method: time_based       # time_based | random
  train_ratio: 0.8

model:
  name: mean
  params: {}

evaluation:
  metrics: [mae, rmse, r2]
  plots:   [scatter, residual_ts, k_curve, spatial_error]
