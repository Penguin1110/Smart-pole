# Phase 3a:CV-tuned IDW power
experiment_id: exp_idw_optimal
seeds: [1, 2, 3, 4, 5]

data:
  cache_path: data/pole_hourly.parquet
  station_info_path: data/MOENV_iot_station.csv
  target_var: pm25
  start: 2025-12-04
  end:   2026-02-05
  freq:  1h

masking:
  strategy: random_point
  ratio: 0.20

neighbors:
  selector: correlation     # 依 Phase 2 finding,Phase 3a 統一用 correlation
  k_list: [30, 20, 10, 5, 3, 1]

# Phase 3a 是純空間模型,features 不開
features:
  enabled: false

split:
  method: time_based
  train_ratio: 0.8

model:
  name: idw_optimal
  params:
    power_grid: [0.5, 1.0, 1.5, 2.0, 2.5, 3.0]
    eps: 1.0
    cv_folds: 5
    cv_seed: 0

evaluation:
  metrics: [mae, rmse, r2]
  plots:   [scatter, residual_ts, k_curve, spatial_error]
  explain: true
