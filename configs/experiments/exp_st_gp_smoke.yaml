experiment_id: exp_st_gp_smoke
seeds: [1]

data:
  cache_path: data/pole_hourly.parquet
  station_info_path: data/MOENV_iot_station.csv
  target_var: pm25
  start: 2025-12-04
  end:   2026-02-05
  freq:  1h

masking:
  strategy: random_point
  ratio: 0.20

neighbors:
  selector: correlation
  k_list: [10]

features:
  enabled: false

split:
  method: time_based
  train_ratio: 0.8

model:
  name: st_gp
  params:
    n_iter:                   20
    lr:                       0.1
    max_train:                1000
    lengthscale_init_space_m: 2000.0
    lengthscale_init_time_h:  24.0
    noise_floor:              0.5
    seed:                     0

evaluation:
  metrics: [mae, rmse, r2]
  plots:   [k_curve]
  explain: true
