# Stream A:IDW(inverse-distance weighted)
experiment_id: exp_idw
seeds: [1, 2, 3, 4, 5]

data:
  cache_path: data/pole_hourly.parquet
  station_info_path: data/MOENV_iot_station.csv
  target_var: pm25
  start: 2025-12-04
  end:   2026-02-05
  freq:  1h

masking:
  strategy: random_point
  ratio: 0.20

neighbors:
  selector: distance       # 也可換 correlation 看 ablation
  k_list: [30, 20, 10, 5, 3, 1]

split:
  method: time_based
  train_ratio: 0.8

model:
  name: idw
  params:
    power: 2.0
    eps:   1.0     # distance 單位公尺,1 m 可忽略;避免 d=0 爆掉

evaluation:
  metrics: [mae, rmse, r2]
  plots:   [scatter, residual_ts, k_curve, spatial_error]
