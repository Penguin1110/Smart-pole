# Stream A:Pearson r 加權平均(取 max(0, r))
experiment_id: exp_corr_weighted
seeds: [1, 2, 3, 4, 5]

data:
  cache_path: data/pole_hourly.parquet
  station_info_path: data/MOENV_iot_station.csv
  target_var: pm25
  start: 2025-12-04
  end:   2026-02-05
  freq:  1h

masking:
  strategy: random_point
  ratio: 0.20

neighbors:
  selector: correlation
  k_list: [30, 20, 10, 5, 3, 1]

split:
  method: time_based
  train_ratio: 0.8

model:
  name: corr_weighted
  params:
    min_overlap: 24   # 與 selector 端使用的 min_overlap 一致

evaluation:
  metrics: [mae, rmse, r2]
  plots:   [scatter, residual_ts, k_curve, spatial_error]
