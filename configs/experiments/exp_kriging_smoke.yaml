# Kriging 煙霧測試:1 seed × K=10 一發,確認 runner 接得起來、時間預算合理
experiment_id: exp_kriging_smoke
seeds: [1]

data:
  cache_path: data/pole_hourly.parquet
  station_info_path: data/MOENV_iot_station.csv
  target_var: pm25
  start: 2025-12-04
  end:   2026-02-05
  freq:  1h

masking:
  strategy: random_point
  ratio: 0.20

neighbors:
  selector: correlation
  k_list: [10]

features:
  enabled: false

split:
  method: time_based
  train_ratio: 0.8

model:
  name: kriging
  params:
    variogram_model: exponential
    n_bins: 8
    max_range_m: 30000.0
    nugget: fit

evaluation:
  metrics: [mae, rmse, r2]
  plots:   [k_curve]
  explain: true
