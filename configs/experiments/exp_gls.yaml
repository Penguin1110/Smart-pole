# Phase 3c:GLS — 殘差 AR(1) 結構校正
experiment_id: exp_gls
seeds: [1, 2, 3, 4, 5]

data:
  cache_path: data/pole_hourly.parquet
  station_info_path: data/MOENV_iot_station.csv
  target_var: pm25
  start: 2025-12-04
  end:   2026-02-05
  freq:  1h

masking:
  strategy: random_point
  ratio: 0.20

neighbors:
  selector: correlation
  k_list: [30, 20, 10, 5, 3, 1]

features:
  enabled: true
  lags:    [1, 2, 3, 6, 24]
  rolling: [3, 6, 24]

split:
  method: time_based
  train_ratio: 0.8

model:
  name: gls
  params:
    cov_structure: ar1      # 殘差 AR(1) — 對 PM2.5 自相關有理據
    max_iter: 3             # Cochrane-Orcutt 多 iter 收益遞減
    min_train: 100

evaluation:
  metrics: [mae, rmse, r2]
  plots:   [scatter, residual_ts, k_curve, spatial_error]
  explain: true
