[project]
name = "smart-pole-imputation"
version = "0.1.0"
description = "高雄 PM2.5 補值演算法包(11 個演算法,Phase 1-3)。"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14.0",        # parquet 讀取
    "scikit-learn>=1.4",    # Ridge / ElasticNet / KFold
    "statsmodels>=0.14",    # OLS / GLSAR
    "gstools>=1.5",         # Ordinary Kriging variogram fit
    "gpytorch>=1.11",       # spatial_gp / st_gp
    "torch>=2.0",           # gpytorch backend
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
